name: Publish study material

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Markdown and math converters
        run: python -m pip install "markdown>=3.5" "latex2mathml>=3.80"
      - name: Build chapter HTML
        run: python build_pdf.py --all --html-only
      - name: Assemble Pages site
        run: |
          mkdir -p _site/chapters
          cp pages/index.html _site/index.html
          cp styles.css _site/styles.css
          cp NEC_Chapter*_Complete_Textbook.html _site/chapters/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
